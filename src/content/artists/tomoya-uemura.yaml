statement:
  ja: |
    幼少期から独学で絵を学び、2014年に作家としての活動を本格化させた。

    学生時代にパラオ人と出会ったことがきっかけで、2016年にパラオ共和国を訪問。
    パラオでの滞在経験を制作テーマとして絵画制作に打ち込む。

    また、近年の「岩壁」シリーズは、香川県の大串石切場跡がモデルとなっている。

    現在は春陽会に所属し、大阪市北区のアトリエで制作に打ち込む。
  en: |
    Self-taught in painting from early childhood, and began working in earnest as an artist in 2014.

    A meeting with a Palauan during university years led to a first visit to the Republic of Palau in 2016.
    The experience of that stay has been the central subject of the painting ever since.

    The recent "Iwakabe (Rock Face)" series takes the former Ogushi quarry site in Kagawa Prefecture as its model.

    Currently a member of Shunyokai, working from a studio in Kita-ku, Osaka.

