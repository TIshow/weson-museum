statement:
  ja: |
    学生時代にパラオ人と出会ったことをきっかけに、2016年にパラオ共和国を訪問。
    以来、その滞在で得た経験を主題として、絵画制作に取り組んでいる。

    近年の「岩壁」シリーズは、香川県の大串石切場跡をモデルとしている。

    現在は大阪市北区のアトリエで制作を続けている。
  en: |
    A meeting with a Palauan during university years led to a first visit to the Republic of Palau in 2016.
    Since then, the experience of that stay has remained the central subject of the painting.

    The recent "Iwakabe (Rock Face)" series takes the former Ogushi quarry site in Kagawa Prefecture as its model.

    Currently working from a studio in Kita-ku, Osaka.

bio:
  ja: |
    小学生の頃から独学で絵を学ぶ。2013年に青山学院大学総合文化政策学部を卒業し、2014年に作家としての活動を始める。
    2023年の第100回春陽展から4年連続で受賞し、2026年に春陽会会員に推挙された。
    春陽会会員、日本美術家連盟会員。
  en: |
    Self-taught in painting since elementary school. Graduated from the School of Cultural and Creative Studies,
    Aoyama Gakuin University, in 2013, and began working as an artist in 2014.
    Received awards at the Shunyo Exhibition for four consecutive years from the 100th edition in 2023,
    and was elected a member of Shunyokai in 2026.
    Member of Shunyokai and of the Japan Artists Association.

